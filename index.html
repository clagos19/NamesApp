<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NamesApp</title>
<meta name="description" content="A mobile directory for tracking parent contacts across school, sports, volunteering, and any other area of your kids' lives.">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12100d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NamesApp">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root {
    --paper: #eef1ee;
    --paper-raised: #ffffff;
    --paper-sunken: #e2e6e1;
    --ink: #1c2521;
    --ink-soft: #5b665f;
    --ink-faint: #8a938c;
    --line: #d8ddd7;
    --line-strong: #c3cac2;
    --danger: #a8412f;
    --focus: #1c2521;

    --area-school: #9c7013;
    --area-sports: #1f7a6c;
    --area-volunteering: #b34d3c;
    --area-extra-1: #6b5b95;
    --area-extra-2: #3d6ca8;
    --area-extra-3: #74842f;
    --area-extra-4: #8a4a72;

    --sheet-shadow: 0 -8px 30px rgba(20, 26, 22, 0.16);
    --card-shadow: 0 1px 2px rgba(20, 26, 22, 0.06);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12100d;
      --paper-raised: #1c1a16;
      --paper-sunken: #221f1a;
      --ink: #f1efe9;
      --ink-soft: #b6b0a4;
      --ink-faint: #7d766a;
      --line: #34312a;
      --line-strong: #433f36;
      --danger: #e0806e;
      --focus: #f1efe9;

      --area-school: #e0aa38;
      --area-sports: #59b7a4;
      --area-volunteering: #e08a72;
      --area-extra-1: #ab98d9;
      --area-extra-2: #85b0e3;
      --area-extra-3: #b4c46f;
      --area-extra-4: #cf8fb2;

      --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }

  :root[data-theme="dark"] {
    --paper: #12100d;
    --paper-raised: #1c1a16;
    --paper-sunken: #221f1a;
    --ink: #f1efe9;
    --ink-soft: #b6b0a4;
    --ink-faint: #7d766a;
    --line: #34312a;
    --line-strong: #433f36;
    --danger: #e0806e;
    --focus: #f1efe9;

    --area-school: #e0aa38;
    --area-sports: #59b7a4;
    --area-volunteering: #e08a72;
    --area-extra-1: #ab98d9;
    --area-extra-2: #85b0e3;
    --area-extra-3: #b4c46f;
    --area-extra-4: #cf8fb2;

    --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  #app {
    width: 100%;
    max-width: 520px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }

  ::selection { background: var(--ink); color: var(--paper); }

  button { font-family: inherit; }
  input, textarea { font-family: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- Header ---------- */

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--paper);
    padding: 18px 20px 0;
    flex: none;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .title-row h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .count-badge {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .search-wrap {
    margin-top: 14px;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    pointer-events: none;
  }

  #search {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    border-radius: 11px;
    padding: 10px 12px 10px 36px;
    font-size: 0.92rem;
    color: var(--ink);
  }

  #search::placeholder { color: var(--ink-faint); }

  .tabs-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 0;
    padding-bottom: 12px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .manage-btn {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .manage-btn:active { background: var(--paper-sunken); }

  .tab {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 6px 13px 6px 10px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }

  .tab .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--tab-c, var(--ink-faint));
    flex: none;
  }

  .tab.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .tab.active .dot { background: var(--paper); }

  /* ---------- List ---------- */

  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 100px;
    -webkit-overflow-scrolling: touch;
  }

  .group-label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 20px 2px 8px;
  }
  .group-label:first-child { margin-top: 8px; }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    --accent: var(--ink-faint);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    box-shadow: var(--card-shadow);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .card-main { flex: 1; min-width: 0; }

  .card-names {
    display: flex;
    align-items: baseline;
    gap: 7px;
    flex-wrap: wrap;
  }

  .parent-name {
    font-weight: 600;
    font-size: 0.98rem;
  }

  .child-name {
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  .card-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-top: 5px;
    font-size: 0.78rem;
  }

  .area-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--c, var(--ink-faint));
    font-weight: 600;
  }
  .area-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--c, var(--ink-faint));
    flex: none;
  }

  .family-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--paper-sunken);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 2px 9px 2px 7px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .family-chip svg { flex: none; }

  .card-notes {
    font-size: 0.78rem;
    color: var(--ink-faint);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-actions {
    display: flex;
    gap: 6px;
    flex: none;
  }

  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper-sunken);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    flex: none;
  }
  .icon-btn:active { background: var(--line); }

  .empty-state {
    text-align: center;
    padding: 60px 24px 20px;
    color: var(--ink-soft);
  }
  .empty-state h2 { font-size: 1.15rem; margin-bottom: 6px; }
  .empty-state p { font-size: 0.88rem; max-width: 34ch; margin: 0 auto; }

  .example-flag {
    display: inline-block;
    margin: 22px 0 10px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border: 1px dashed var(--line-strong);
    border-radius: 999px;
    padding: 4px 10px;
  }

  /* ---------- FAB ---------- */

  .fab {
    position: absolute;
    right: 20px;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(20, 26, 22, 0.28);
    z-index: 25;
  }
  .fab:active { transform: scale(0.94); }

  /* ---------- Sheet (add/edit) ---------- */

  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 15, 0.4);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    background: var(--paper-raised);
    border-radius: 20px 20px 0 0;
    box-shadow: var(--sheet-shadow);
    z-index: 31;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { transform: translate(-50%, 0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line-strong);
    margin: 10px auto 4px;
    flex: none;
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 18px 12px;
    flex: none;
  }
  .sheet-head h2 { font-size: 1.2rem; font-weight: 600; }

  .text-btn {
    border: none;
    background: none;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 6px 4px;
  }
  .text-btn.primary { color: var(--ink); }
  .text-btn.danger { color: var(--danger); }

  .sheet-body {
    overflow-y: auto;
    padding: 4px 18px 24px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--paper-sunken);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 0.98rem;
  }
  .field textarea { resize: vertical; min-height: 64px; }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip-select {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--paper-sunken);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .chip-select .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--chip-c, var(--ink-faint));
  }
  .chip-select.selected {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .chip-select.selected .dot { background: var(--paper); }

  .new-area-input {
    display: none;
    margin-top: 10px;
  }
  .new-area-input.show { display: block; }

  .name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .name-row .name-input { flex: 1; }

  .remove-row-btn {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper-sunken);
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .remove-row-btn:active { background: var(--line); }

  .add-row-btn {
    border: none;
    background: none;
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.84rem;
    padding: 4px 2px;
  }
  .add-row-btn:active { color: var(--ink); }

  .category-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .category-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--line);
    background: var(--paper-sunken);
    border-radius: 10px;
    padding: 9px 10px 9px 14px;
  }
  .category-row .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
  }
  .category-row .cat-name {
    flex: 1;
    font-weight: 500;
    font-size: 0.92rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .category-empty {
    color: var(--ink-faint);
    font-size: 0.85rem;
    padding: 6px 2px 4px;
  }
  .category-add-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .category-add-row input { flex: 1; }

  .add-icon-btn {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-icon-btn:active { transform: scale(0.94); }

  .delete-row {
    margin-top: 6px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .delete-row button {
    width: 100%;
    border: none;
    background: none;
    color: var(--danger);
    font-size: 0.92rem;
    font-weight: 600;
    padding: 10px;
  }

  .sync-note {
    text-align: center;
    font-size: 0.68rem;
    color: var(--ink-faint);
    padding: 8px 0 2px;
  }

  .sign-out-btn {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding-top: 16px;
    border: none;
    border-top: 1px solid var(--line);
    background: none;
    color: var(--ink-faint);
    font-size: 0.82rem;
    text-align: center;
  }
  .sign-out-btn:active { color: var(--danger); }

  /* ---------- Auth gate ---------- */

  .auth-gate {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }

  .auth-card {
    width: 100%;
    max-width: 340px;
  }

  .auth-card h1 {
    font-size: 1.7rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 6px;
  }

  .auth-sub {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.88rem;
    margin: 0 0 24px;
  }

  .auth-error {
    color: var(--danger);
    font-size: 0.82rem;
    text-align: center;
    margin: -6px 0 14px;
  }

  .auth-submit {
    width: 100%;
    margin-top: 6px;
    border: none;
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    padding: 13px;
    font-size: 0.98rem;
    font-weight: 600;
  }
  .auth-submit:active { transform: scale(0.98); }
  .auth-submit:disabled { opacity: 0.6; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .scrim, .fab { transition: none; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="title-row">
      <h1>NamesApp</h1>
      <span class="count-badge" id="countBadge">0 saved</span>
    </div>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.4"/><path d="M11 11L14.2 14.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="Search parent, child, or area" autocomplete="off">
    </div>
    <div class="tabs-row">
      <div class="tabs" id="tabs"></div>
      <button type="button" class="manage-btn" id="manageCatsBtn" aria-label="Manage categories">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 20.5V17l10.5-10.5 3.5 3.5L7.5 20.5H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 8l3.5 3.5" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </header>

  <main id="main"></main>

  <button class="fab" id="addBtn" aria-label="Add contact">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</div>

<div class="scrim" id="scrim"></div>
<form class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <button type="button" class="text-btn" id="cancelBtn">Cancel</button>
    <h2 id="sheetTitle">Add contact</h2>
    <button type="submit" class="text-btn primary">Save</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>Parents</label>
      <div class="name-list" id="parentsList"></div>
      <button type="button" class="add-row-btn" id="addParentBtn">+ Add another parent</button>
    </div>
    <div class="field">
      <label>Children</label>
      <div class="name-list" id="childrenList"></div>
      <button type="button" class="add-row-btn" id="addChildBtn">+ Add another child</button>
    </div>
    <div class="field">
      <label>Family member</label>
      <div class="chip-row" id="familyChips"></div>
    </div>
    <div class="field">
      <label>Categories</label>
      <div class="chip-row" id="areaChips"></div>
      <div class="new-area-input" id="newAreaWrap">
        <input id="newAreaInput" placeholder="Name this category, e.g. Chess Club">
      </div>
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" type="tel" placeholder="(555) 123-4567" autocomplete="off">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="name@email.com" autocomplete="off">
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Carpool days, allergy info, anything worth remembering"></textarea>
    </div>
    <div class="delete-row" id="deleteRow" style="display:none">
      <button type="button" id="deleteBtn">Delete contact</button>
    </div>
  </div>
  <div class="sync-note" id="syncNote"></div>
</form>

<form class="sheet" id="categorySheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>Categories</h2>
    <button type="button" class="text-btn primary" id="closeCatsBtn">Done</button>
  </div>
  <div class="sheet-body">

  var els = {

    deleteRow: document.getElementById("deleteRow"),

    newAreaInput: document.getElementById("newAreaInput"),
    familyChips: document.getElementById("familyChips"),

    childrenList: document.getElementById("childrenList"),
    addChildBtn: document.getElementById("addChildBtn"),
    phone: document.getElementById("phone"),

    notes: document.getElementById("notes"),
    syncNote: document.getElementById("syncNote"),

  var formAreas = [];
  var formFamily = [];
  var dbCollection = null;
  var categoriesCollection = null;

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function normalizeRecord(r) {
    if (Array.isArray(r.parents)) return r;
    var migrated = {};
    for (var k in r) if (Object.prototype.hasOwnProperty.call(r, k)) migrated[k] = r[k];
    migrated.parents = r.parentName ? [r.parentName] : [];
    migrated.children = r.childName ? [r.childName] : [];
    migrated.areas = r.area ? [r.area] : [];
    delete migrated.parentName;
    delete migrated.childName;
    delete migrated.area;
    return migrated;
  }

  function makeNameList(containerEl, addBtnEl, placeholder) {
    function read() {
      return Array.prototype.map.call(containerEl.querySelectorAll(".name-input"), function (inp) { return inp.value; });
    }
    function renderRows(values) {
      var vals = values && values.length ? values : [""];
      containerEl.innerHTML = vals.map(function (v, i) {
        return '<div class="name-row"><input type="text" class="name-input" value="' + escapeHtml(v) + '" placeholder="' + escapeHtml(placeholder) + '" autocomplete="off">' +
          '<button type="button" class="remove-row-btn" data-idx="' + i + '" aria-label="Remove">' + X_ICON + "</button></div>";
      }).join("");
      Array.prototype.forEach.call(containerEl.querySelectorAll(".remove-row-btn"), function (btn) {
        btn.addEventListener("click", function () {
          var current = read();
          current.splice(Number(btn.getAttribute("data-idx")), 1);
          renderRows(current);
        });
      });
    }
    addBtnEl.addEventListener("click", function () {
      var current = read();
      current.push("");
      renderRows(current);
      var inputs = containerEl.querySelectorAll(".name-input");
      if (inputs.length) inputs[inputs.length - 1].focus();
    });
    return {
      render: renderRows,
      read: function () { return read().map(function (s) { return s.trim(); }).filter(Boolean); }
    };
  }

  var parentsList = makeNameList(els.parentsList, els.addParentBtn, "Parent name");
  var childrenList = makeNameList(els.childrenList, els.addChildBtn, "Child's name");

  function persistLocal() {
    try { localStorage.setItem("parentRosterData", JSON.stringify(state.records)); } catch (e) {}
  }

  function persistCategoriesLocal() {
    try { localStorage.setItem("parentRosterCategories", JSON.stringify(state.categories)); } catch (e) {}
  }

  function render() {
    renderCount();
    renderTabs();
    renderList();
  }

  function renderCount() {
    var n = state.records.length;
    els.countBadge.textContent = n === 1 ? "1 saved" : n + " saved";
  }

  function renderTabs() {
    var tabs = ["All"].concat(state.categories.map(function (c) { return c.name; }));
    els.tabs.innerHTML = tabs.map(function (a) {
      var active = a === state.activeTab;
      var dotStyle = a === "All" ? "" : ' style="--tab-c: var(' + areaVar(a) + ')"';
      return '<button type="button" class="tab' + (active ? " active" : "") + '" data-area="' + escapeHtml(a) + '"' + dotStyle + '>' +
        (a === "All" ? "" : '<span class="dot"></span>') +
        escapeHtml(a) + "</button>";
    }).join("");
    Array.prototype.forEach.call(els.tabs.querySelectorAll(".tab"), function (btn) {
      btn.addEventListener("click", function () {
        state.activeTab = btn.getAttribute("data-area");
        render();
      });
    });
  }

  function matchesFilters(r) {
    if (state.activeTab !== "All" && (!r.areas || r.areas.indexOf(state.activeTab) === -1)) return false;
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    var haystack = [].concat(r.parents || [], r.children || [], r.areas || [], r.family || [], [r.notes || ""]).join(" • ").toLowerCase();
    return haystack.indexOf(q) !== -1;
  }

  function cardHtml(r) {
    var areas = r.areas || [];
    var accentStyle = areas.length ? "--accent: var(" + areaVar(areas[0]) + ");" : "";
    var primaryName = (r.parents && r.parents[0]) || "Unnamed";
    var actions = "";
    if (r.phone) {
      actions += '<a class="icon-btn" href="tel:' + escapeHtml(r.phone) + '" aria-label="Call ' + escapeHtml(primaryName) + '" onclick="event.stopPropagation()">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.2c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="currentColor"/></svg></a>';
    }
    if (r.email) {
      actions += '<a class="icon-btn" href="mailto:' + escapeHtml(r.email) + '" aria-label="Email ' + escapeHtml(primaryName) + '" onclick="event.stopPropagation()">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11z" stroke="currentColor" stroke-width="1.5"/><path d="M4 6.5l8 6 8-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>';
    }
    var parentsText = (r.parents && r.parents.length) ? r.parents.join(" & ") : "Unnamed";
    var childrenText = (r.children && r.children.length) ? r.children.join(", ") : "";
    var childPrefix = "· " + ((r.parents && r.parents.length > 1) ? "parents of " : "parent of ");
    var areaChips = areas.map(function (a) {
      return '<span class="area-chip" style="--c: var(' + areaVar(a) + ')"><span class="dot"></span>' + escapeHtml(a) + "</span>";
    }).join("");
    var familyChips = (r.family || []).map(function (name) {
      return '<span class="family-chip">' + PERSON_ICON + escapeHtml(name) + "</span>";
    }).join("");
    var metaRow = areaChips || familyChips ? '<div class="card-meta">' + areaChips + familyChips + "</div>" : "";
    return '<div class="card' + (r.example ? " is-example" : "") + '" style="' + accentStyle + '" data-id="' + escapeHtml(r.id) + '">' +
      '<div class="card-main">' +
        '<div class="card-names">' +
          '<span class="parent-name">' + escapeHtml(parentsText) + "</span>" +
          (childrenText ? '<span class="child-name">' + childPrefix + escapeHtml(childrenText) + "</span>" : "") +
        "</div>" +
        metaRow +
        (r.notes ? '<div class="card-notes">' + escapeHtml(r.notes) + "</div>" : "") +
      "</div>" +
      '<div class="card-actions">' + actions + "</div>" +
    "</div>";
  }

  function renderList() {
    var usingExamples = state.records.length === 0;
    var source = usingExamples ? EXAMPLES : state.records;
    var filtered = source.filter(matchesFilters).slice().sort(function (a, b) {
      var an = (a.parents && a.parents[0]) || "";
      var bn = (b.parents && b.parents[0]) || "";
      return an.localeCompare(bn);
    });

    if (state.records.length === 0) {
      els.main.innerHTML =
        '<div class="empty-state"><h2>No contacts yet</h2><p>Save a parent from school, sports, or anywhere else your family shows up. Here is what it will look like:</p></div>' +
        '<div class="example-flag">Examples below</div>' +
        '<div class="card-list">' + filtered.map(cardHtml).join("") + "</div>";
      return;
    }

    if (filtered.length === 0) {
      els.main.innerHTML = '<div class="empty-state"><h2>No matches</h2><p>Try a different search or tab.</p></div>';
      return;
    }

    els.main.innerHTML = '<div class="card-list">' + filtered.map(cardHtml).join("") + "</div>";
    Array.prototype.forEach.call(els.main.querySelectorAll(".card:not(.is-example)"), function (card) {
      card.addEventListener("click", function () {
        openEdit(card.getAttribute("data-id"));
      });
    });
  }

  // ---------- Sheet ----------

  function renderAreaChips() {
    var known = state.categories.map(function (c) { return c.name; });
    var pending = formAreas.filter(function (a) { return known.indexOf(a) === -1; });
    var names = known.concat(pending);
    els.areaChips.innerHTML = names.map(function (a) {
      var sel = formAreas.indexOf(a) !== -1;
      return '<button type="button" class="chip-select' + (sel ? " selected" : "") + '" data-area="' + escapeHtml(a) + '" style="--chip-c: var(' + areaVar(a) + ')"><span class="dot"></span>' + escapeHtml(a) + "</button>";
    }).join("") + '<button type="button" class="chip-select" id="otherAreaChip">+ New</button>';

    Array.prototype.forEach.call(els.areaChips.querySelectorAll(".chip-select[data-area]"), function (btn) {
      btn.addEventListener("click", function () {
        var name = btn.getAttribute("data-area");
        var idx = formAreas.indexOf(name);
        if (idx === -1) formAreas.push(name); else formAreas.splice(idx, 1);
        renderAreaChips();
      });
    });
    document.getElementById("otherAreaChip").addEventListener("click", function () {
      els.newAreaWrap.classList.add("show");
      els.newAreaInput.focus();
    });
  }

  function renderFamilyChips() {
    els.familyChips.innerHTML = FAMILY_MEMBERS.map(function (name) {
      var sel = formFamily.indexOf(name) !== -1;
      return '<button type="button" class="chip-select' + (sel ? " selected" : "") + '" data-name="' + escapeHtml(name) + '">' + escapeHtml(name) + "</button>";
    }).join("");
    Array.prototype.forEach.call(els.familyChips.querySelectorAll(".chip-select"), function (btn) {
      btn.addEventListener("click", function () {
        var name = btn.getAttribute("data-name");
        var idx = formFamily.indexOf(name);
        if (idx === -1) formFamily.push(name); else formFamily.splice(idx, 1);
        renderFamilyChips();
      });
    });
  }

  function commitNewArea() {
    var name = els.newAreaInput.value.trim();
    els.newAreaWrap.classList.remove("show");
    if (!name) return;
    addCategory(name);
    if (formAreas.indexOf(name) === -1) formAreas.push(name);
    els.newAreaInput.value = "";
    renderAreaChips();
  }

  els.newAreaInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); commitNewArea(); }

  els.newAreaInput.addEventListener("blur", commitNewArea);

  function openSheet(title, record) {
    state.editingId = record ? record.id : null;
    els.sheetTitle.textContent = title;
    parentsList.render(record && record.parents && record.parents.length ? record.parents : [""]);
    childrenList.render(record && record.children ? record.children : []);
    els.phone.value = record ? record.phone || "" : "";
    els.email.value = record ? record.email || "" : "";
    els.notes.value = record ? record.notes || "" : "";
    formAreas = record ? (record.areas ? record.areas.slice() : []) : (state.activeTab !== "All" ? [state.activeTab] : []);
    formFamily = record && record.family ? record.family.slice() : [];
    els.newAreaInput.value = "";
    els.newAreaWrap.classList.remove("show");
    els.deleteRow.style.display = record ? "block" : "none";
    renderAreaChips();
    renderFamilyChips();
    els.scrim.classList.add("open");
    els.sheet.classList.add("open");
    setTimeout(function () {
      var firstInput = els.parentsList.querySelector(".name-input");
      if (firstInput) firstInput.focus();
    }, 250);
  }

  function closeSheet() {
    els.scrim.classList.remove("open");
    els.sheet.classList.remove("open");
    state.editingId = null;
  }

  function openEdit(id) {
    var r = state.records.filter(function (x) { return x.id === id; })[0];
    if (r) openSheet("Edit contact", r);
  }

  els.addBtn.addEventListener("click", function () { openSheet("Add contact", null); });
  els.cancelBtn.addEventListener("click", closeSheet);
  els.scrim.addEventListener("click", function () { closeSheet(); closeCategorySheet(); });

  els.sheet.addEventListener("submit", function (e) {
    e.preventDefault();
    var parents = parentsList.read();
    if (!parents.length) {
      var firstInput = els.parentsList.querySelector(".name-input");
      if (firstInput) firstInput.focus();
      return;
    }
    var data = {
      parents: parents,
      children: childrenList.read(),
      areas: formAreas.slice(),
      family: formFamily.slice(),
      phone: els.phone.value.trim(),
      email: els.email.value.trim(),
      notes: els.notes.value.trim()
    };
    if (state.editingId) {
      updateRecord(state.editingId, data);
    } else {
      addRecord(data);
    }
    closeSheet();
  });

  els.deleteBtn.addEventListener("click", function () {
    if (state.editingId) deleteRecord(state.editingId);
    closeSheet();
  });

  els.search.addEventListener("input", function () {
    state.query = els.search.value;
    renderList();
  });

  // ---------- Category management ----------

  function renderCategoryList() {
    if (!state.categories.length) {
      els.categoryList.innerHTML = '<div class="category-empty">No categories yet — add one below.</div>';
      return;

    els.categoryList.innerHTML = state.categories.map(function (c) {
      return '<div class="category-row"><span class="dot" style="background: var(' + areaVar(c.name) + ')"></span>' +
        '<span class="cat-name">' + escapeHtml(c.name) + "</span>" +
        '<button type="button" class="remove-row-btn" data-id="' + escapeHtml(c.id) + '" aria-label="Delete ' + escapeHtml(c.name) + '">' + X_ICON + "</button></div>";
    }).join("");
    Array.prototype.forEach.call(els.categoryList.querySelectorAll(".remove-row-btn"), function (btn) {
      btn.addEventListener("click", function () {
        var cat = state.categories.filter(function (c) { return c.id === btn.getAttribute("data-id"); })[0];
        if (cat) deleteCategory(cat);
      });
    });
  }

  function openCategorySheet() {
    renderCategoryList();
    els.newCategoryInput.value = "";
    els.scrim.classList.add("open");
    els.categorySheet.classList.add("open");
  }

  function closeCategorySheet() {
    els.scrim.classList.remove("open");
    els.categorySheet.classList.remove("open");
  }

  els.manageCatsBtn.addEventListener("click", openCategorySheet);
  els.closeCatsBtn.addEventListener("click", closeCategorySheet);

  els.categorySheet.addEventListener("submit", function (e) {
    e.preventDefault();
    addCategory(els.newCategoryInput.value);
    els.newCategoryInput.value = "";
    els.newCategoryInput.focus();
  });
  els.addCategoryBtn.addEventListener("click", function () {
    addCategory(els.newCategoryInput.value);
    els.newCategoryInput.value = "";
    els.newCategoryInput.focus();
  });

  function addCategory(name) {
    name = (name || "").trim();
    if (!name) return;
    var existing = state.categories.filter(function (c) { return c.name.toLowerCase() === name.toLowerCase(); })[0];
    if (existing) return;
    if (state.mode === "db" && categoriesCollection) {
      categoriesCollection.add({ name: name }).catch(function (err) { console.error("add category failed", err); });
    } else {
      state.categories.push({ id: "cat-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6), name: name });
      state.categories.sort(function (a, b) { return a.name.localeCompare(b.name); });
      persistCategoriesLocal();
      render();
      renderCategoryList();
    }
  }

  function deleteCategory(cat) {
    var used = state.records.filter(function (r) { return r.areas && r.areas.indexOf(cat.name) !== -1; }).length;
    var msg = used > 0
      ? 'Delete "' + cat.name + '"? It will be removed from ' + used + " contact" + (used === 1 ? "" : "s") + "."
      : 'Delete "' + cat.name + '"?';
    if (!window.confirm(msg)) return;
    state.records.forEach(function (r) {
      if (r.areas && r.areas.indexOf(cat.name) !== -1) {
        updateRecord(r.id, { areas: r.areas.filter(function (a) { return a !== cat.name; }) });
      }
    });
    if (state.mode === "db" && categoriesCollection) {
      categoriesCollection.doc(cat.id).delete().catch(function (err) { console.error("delete category failed", err); });
    } else {
      state.categories = state.categories.filter(function (c) { return c.id !== cat.id; });
      persistCategoriesLocal();
      render();
      renderCategoryList();
    }
    var idx = formAreas.indexOf(cat.name);
    if (idx !== -1) { formAreas.splice(idx, 1); renderAreaChips(); }
    if (state.activeTab === cat.name) { state.activeTab = "All"; }
  }

  // ---------- Storage ----------

  function addRecord(data) {
    if (state.mode === "db" && dbCollection) {
      data.createdAt = Date.now();
      dbCollection.add(data).catch(function (err) { console.error("db add failed", err); });
    } else {
      data.id = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
      data.createdAt = Date.now();
      state.records.push(data);
      persistLocal();
      render();
    }
  }

  function updateRecord(id, data) {
    if (state.mode === "db" && dbCollection) {
      dbCollection.doc(id).update(data).catch(function (err) { console.error("db update failed", err); });
    } else {
      var idx = state.records.findIndex(function (r) { return r.id === id; });
      if (idx !== -1) state.records[idx] = Object.assign({}, state.records[idx], data);
      persistLocal();
      render();
    }
  }

  function deleteRecord(id) {
    if (state.mode === "db" && dbCollection) {
      dbCollection.doc(id).delete().catch(function (err) { console.error("db delete failed", err); });
    } else {
      state.records = state.records.filter(function (r) { return r.id !== id; });
      persistLocal();
      render();
    }
  }

  function fallbackToLocal() {
    state.mode = "local";
    try {
      state.records = JSON.parse(localStorage.getItem("parentRosterData") || "[]").map(normalizeRecord);
    } catch (e) {
      state.records = [];
    }
    persistLocal();
    if (localStorage.getItem("parentRosterMetaInit")) {
      try {
        state.categories = JSON.parse(localStorage.getItem("parentRosterCategories") || "[]");
      } catch (e) {
        state.categories = [];
      }
    } else {
      state.categories = DEFAULT_CATEGORY_NAMES.map(function (name) {
        return { id: "cat-" + name.toLowerCase(), name: name };
      });
      persistCategoriesLocal();
      try { localStorage.setItem("parentRosterMetaInit", "1"); } catch (e) {}
    }
    els.syncNote.textContent = "Saved on this device only";
    render();
  }

  var dbUnsubscribes = [];

  function setupDbBackend(db, syncLabel, seedFn) {
    state.mode = "db";
    dbCollection = db.collection("parents");
    categoriesCollection = db.collection("categories");
    els.syncNote.textContent = syncLabel;

    var metaRef = db.doc("meta/init");
    metaRef.get().then(function (snap) {
      if (!snap.exists) {
        seedFn();
        metaRef.set({ categoriesSeeded: true, seededAt: Date.now() });
      }
    }).catch(function (err) { console.error("seed check failed", err); });

    dbUnsubscribes.push(dbCollection.onSnapshot(function (snap) {
      state.records = snap.docs.map(function (d) {
        var data = Object.assign({ id: d.id }, d.data());
        if (!Array.isArray(data.parents)) {
          var migrated = normalizeRecord(data);
          dbCollection.doc(d.id).set(migrated).catch(function (err) { console.error("migrate failed", err); });
          data = migrated;
        }
        return data;
      });
      render();
    }, function (err) {
      console.error("db subscribe failed", err);
      fallbackToLocal();
    }));

    dbUnsubscribes.push(categoriesCollection.onSnapshot(function (snap) {
      state.categories = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      render();
      renderCategoryList();
      renderAreaChips();
    }, function (err) {
      console.error("categories subscribe failed", err);
    }));
  }

  function teardownDbBackend() {
    dbUnsubscribes.forEach(function (unsub) { unsub(); });
    dbUnsubscribes = [];
    dbCollection = null;
    categoriesCollection = null;
    state.records = [];
    state.categories = [];
  }

  function tryClaudeArtifactDb() {
    if (typeof window.claude === "undefined" || typeof window.claude.use !== "function") {
      fallbackToLocal();
      return;
    }
    window.claude.use("db").then(function (db) {
      if (!db) { fallbackToLocal(); return; }
      setupDbBackend(db, "Synced", function () {
        DEFAULT_CATEGORY_NAMES.forEach(function (name) { categoriesCollection.add({ name: name }); });
      });
    }).catch(function () {
      fallbackToLocal();
    });
  }

  function showAuthGate() {
    els.authGate.hidden = false;
    els.signOutBtn.hidden = true;
  }

  function hideAuthGate() {
    els.authGate.hidden = true;
    els.authError.hidden = true;
    els.authForm.reset();
  }

  function setAuthError(message) {
    els.authError.textContent = message;
    els.authError.hidden = false;
  }

  els.authForm.addEventListener("submit", function (e) {
    e.preventDefault();
    els.authSubmit.disabled = true;
    els.authError.hidden = true;
    firebase.auth().signInWithEmailAndPassword(els.authEmail.value.trim(), els.authPassword.value)
      .catch(function (err) {
        console.error("sign-in failed", err);
        setAuthError(err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found"
          ? "Wrong email or password."
          : "Couldn't sign in — try again.");
      })
      .finally(function () { els.authSubmit.disabled = false; });
  });

  els.signOutBtn.addEventListener("click", function () {
    firebase.auth().signOut();
  });

  function initStorage() {
    if (typeof firebase !== "undefined" && firebaseConfigured()) {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        var firebaseBackendActive = false;
        firebase.auth().onAuthStateChanged(function (user) {
          if (user) {
            hideAuthGate();
            els.signOutBtn.hidden = false;
            if (!firebaseBackendActive) {
              firebaseBackendActive = true;
              setupDbBackend(firebase.firestore(), "Synced via Firebase", function () {
                IMPORT_CATEGORIES.forEach(function (cat) { categoriesCollection.add(cat); });
                IMPORT_CONTACTS.forEach(function (contact) { dbCollection.add(contact); });
              });
            }
          } else {
            if (firebaseBackendActive) {
              firebaseBackendActive = false;
              teardownDbBackend();
              render();
            }
            showAuthGate();
          }
        });
      } catch (err) {
        console.error("firebase init failed", err);
        tryClaudeArtifactDb();
      }
      return;
    }
    tryClaudeArtifactDb();
  }

  render();
  initStorage();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
